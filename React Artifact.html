*{

html,body,#root{

  margin:0;
  overflow:hidden;
}

body{

  background:#171017;
  color:#171017;
}

.font-display{
  font-family:'Archivo Black', 'Baloo 2', sans-serif;

@keyframes shakeX{
  0%,100%{
    transform:translateX(0) rotate(0deg);
  }

  15%{
    transform:translateX(-12px) rotate(-1.2deg);
  }

  30%{
    transform:translateX(11px) rotate(1.2deg);
  }

  45%{
    transform:translateX(-9px) rotate(-.8deg);
  }

  60%{
    transform:translateX(8px) rotate(.8deg);
  }

  75%{
    transform:translateX(-5px);
  }

  90%{
    transform:translateX(3px);
  }
}

@keyframes popIn{
  0%{
    transform:scale(.7) rotate(-3deg);
    opacity:0;
  }

  70%{
    transform:scale(1.08) rotate(1deg);
    opacity:1;
  }

  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-8px) rotate(2deg);
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-10vh) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(110vh) rotate(720deg);
    opacity:.9;
  }
}

@keyframes burst{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }

  100%{
    transform:translate(var(--dx), var(--dy)) scale(.2);
    opacity:0;
  }
}

@keyframes firePulse{
  0%,100%{
    transform:scale(1) rotate(-3deg);
  }

  50%{
    transform:scale(1.12) rotate(3deg);
  }
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(-2deg);
  }

  50%{
    transform:rotate(2deg);
  }
}

@keyframes scoreUp{
  0%{
    transform:scale(1);
  }

  40%{
    transform:scale(1.35) rotate(2deg);
  }

  100%{
    transform:scale(1);
  }
}

@keyframes pulseRing{
  0%{
    box-shadow:0 0 0 0 rgba(255,255,255,.55);
  }

  100%{
    box-shadow:0 0 0 18px rgba(255,255,255,0);
  }
}

@keyframes marquee{
  0%{
    transform:translateX(0);
  }

  100%{
    transform:translateX(-50%);
  }
}

.animate-shake{
  animation:shakeX .45s ease;
}

.animate-pop{
  animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both;
}

.animate-floaty{
  animation:floaty 2.6s ease-in-out infinite;
}

.animate-fire{
  animation:firePulse .55s ease-in-out infinite;
}

.animate-wiggle{
  animation:wiggle .5s ease-in-out infinite;
}

.animate-score{
  animation:scoreUp .35s ease;
}

.animate-pulse-ring{
  animation:pulseRing 1.2s ease-out infinite;
}

.marquee-track{
  animation:marquee 14s linear infinite;
}

.confetti-piece{
  animation:confettiFall linear forwards;
}

.particle-dot{
  animation:burst .65s ease-out forwards;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}
